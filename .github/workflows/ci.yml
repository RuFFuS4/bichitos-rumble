# CI — Bichitos Rumble
#
# H0 (2026-08-16): primer pipeline del proyecto. Todos los gates ya
# existían como rituales manuales (npm run check, parity, server tsc,
# smoke de Playwright); esto solo los automatiza en push/PR a dev y main.
#
# Jobs independientes para que un fallo señale su dominio:
#   client        — tsc + verify GLBs + parity cliente/servidor + vite build
#   server        — tsc --noEmit del server Colyseus
#   server-shutdown — un cierre del servidor anula la partida, no la puntúa
#   server-docker — la imagen de Railway: build, arranque, sonda y parada
#   smoke         — Playwright chromium contra el dev server y contra el
#                   bundle de producción (vite build + vite preview)
#
# Node: cada lado usa la de su package.json — el cliente, engines 24.x (la
# misma con la que compila Vercel); el servidor, 22.x (su imagen
# node:22-alpine).
#
# También corre en las ramas de feature que se empujen (claude/**,
# codex/**): así el CI se ve en verde ANTES de integrar en dev. Empujar la
# rama es opcional; sin push, nada corre.

name: CI

on:
  push:
    branches: [main, dev, 'claude/**', 'codex/**']
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client (check + parity)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      # npm run check = tsc --noEmit + tests de tool-patch + verify-critter-glbs
      # + versión de los GLB de bicho (stamp-critter-glbs --check) + RUN_GAIT
      # (inspect-stride --check) + parity (habilidades, P/W/S y espejos del sim)
      # + vite build + clean-dist-raw + payload budget (30 MB / 3 MB por fichero)
      - run: npm run check
      # Tests Vitest del sim determinista (incluye los invariantes del
      # generador de arena y su golden de layout por hash). Fuera de
      # `check` a proposito: `check` es el gate de build, esto el de logica.
      - run: npm run test:sim

  server:
    name: Server (tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: server/package.json
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  server-shutdown:
    name: Server (cierre limpio)
    # A server shutdown mid-match (Railway's SIGTERM on every deploy that
    # touches server/) voids the match instead of scoring it. Two checks:
    # real rooms on the in-process matchMaker (tests/shutdown-check.mts),
    # and the real server with 4 SDK clients and a real SIGTERM
    # (scripts/online-shutdown-e2e.mjs, which needs the root's SDK too).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: server/package.json
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: server
      - run: npm run test:shutdown
        working-directory: server
      - run: node scripts/online-shutdown-e2e.mjs

  server-docker:
    name: Server (docker build)
    # Builds the EXACT image Railway builds (multi-stage node:22-alpine).
    # Catches native-module breakage (better-sqlite3 prebuilds vs musl)
    # and Dockerfile drift BEFORE a merge to main triggers the real
    # deploy. Added in H1 when better-sqlite3 jumped a major.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bichitos-server-ci ./server
      # Sanity: the runtime image must be able to load the native module
      # and the admin CLI (both were production-only failure modes once).
      # dynamic import() because the server package is ESM; `|| true`
      # because the CLI exits 1 without a DB and Actions runs pipefail.
      - run: docker run --rm bichitos-server-ci node -e "import('better-sqlite3').then(() => console.log('better-sqlite3 native OK'))"
      - run: (docker run --rm bichitos-server-ci node scripts/admin-players.mjs list 2>&1 || true) | grep -q "DB file not found" && echo "admin CLI present OK"
      # The image must also BOOT and serve: /health, the version guard (523
      # client_outdated / server_outdated) and a private room with the right
      # protocol (scripts/probe-server.mjs --full; the runner's own Node has
      # fetch, no npm ci needed). The room is private, so no matchmaking
      # sees it, and it dies on its own when the seat expires (2 s here).
      - name: Boot the image and probe it
        run: |
          docker run -d --name br-ci -p 127.0.0.1:2567:2567 -e COLYSEUS_SEAT_RESERVATION_TIME=2 bichitos-server-ci
          node scripts/probe-server.mjs http://127.0.0.1:2567 --full
          timeout 15 sh -c 'until docker logs br-ci 2>&1 | grep -q "\[BrawlRoom\] disposed"; do sleep 0.5; done'
      # The maintenance switch as Rafa uses it from Railway's container
      # shell: the image carries the CLI, the file lands next to the DB and
      # the running server picks it up (it re-reads every 3 s) — no restart.
      - name: Maintenance window in the image
        run: |
          docker exec br-ci node scripts/maintenance.mjs on --for 5
          sleep 3.5
          node scripts/probe-server.mjs http://127.0.0.1:2567 --maintenance active
          docker exec br-ci node scripts/maintenance.mjs off
          sleep 3.5
          node scripts/probe-server.mjs http://127.0.0.1:2567 --maintenance none
      # Railway stops the old container with SIGTERM. node is PID 1 in the
      # image; Colyseus handles the signal and exits 0. ExitCode 137 would
      # mean the handler never ran and docker had to SIGKILL it.
      - name: Stop it cleanly (SIGTERM)
        run: |
          docker stop -t 10 br-ci
          code=$(docker inspect -f '{{.State.ExitCode}}' br-ci)
          echo "exit code: $code"
          test "$code" = 0
          docker logs br-ci 2>&1 | grep "\[server\] shutting down"
          docker logs br-ci 2>&1 | grep "\[server\] shut down in"
      - if: failure()
        run: docker logs br-ci || true
      - if: always()
        run: docker rm -f br-ci || true

  smoke:
    name: Smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      # The same suite against the production bundle: what only breaks
      # after minification or chunk splitting (playwright.prod.config.ts).
      - run: npm run test:smoke:prod
